[project]
name = "motion-conductor"
version = "1.0.0"
description = "Vivid Allusion Motion Conductor"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "pyyaml",
    "python-dotenv",
    "rich",
]

[project.scripts]
motion-conductor = "src.main_verbose:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
